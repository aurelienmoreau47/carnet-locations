# Supabase (offre gratuite) met en pause un projet resté 7 jours sans activité.
# Cette tâche interroge la base tous les 3 jours pour la garder éveillée.
# Elle lit l'adresse et la clé publique dans config.js : rien à configurer.
name: Garder la base active

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger Supabase
        run: |
          URL=$(sed -n "s/.*supabaseUrl: *'\([^']*\)'.*/\1/p" config.js)
          KEY=$(sed -n "s/.*supabaseKey: *'\([^']*\)'.*/\1/p" config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js vide : rien à faire"; exit 0; fi
          curl -sS -o /dev/null -w "Réponse Supabase : %{http_code}\n" "$URL/rest/v1/appartements?select=id" -H "apikey: $KEY"
